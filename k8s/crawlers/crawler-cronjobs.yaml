# Schedules stay suspended until the live crawler and cursor are handed over.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crawler-state-pvc
  namespace: default
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: steam-crawler-config
  namespace: default
data:
  KAFKA_BOOTSTRAP_SERVERS: steam-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
  CRAWLER_OUTPUT: kafka
  CRAWLER_TOTAL_WORKERS: "2"
  CRAWLER_TARGET_LIMIT: "2000"
  TARGET_APP_LIST_PATH: /data/state/targets/target_apps.json
  CURSOR_STATE_DIR: /data/state
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: steam-ccu-crawler
  namespace: default
  labels:
    steam.insights/sharded: "true"
spec:
  schedule: "0 * * * *"
  timeZone: Asia/Bangkok
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3500
      backoffLimit: 2
      completionMode: Indexed
      completions: 2
      parallelism: 2
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
          - name: crawler
            image: steam-crawler:local
            imagePullPolicy: IfNotPresent
            command: [python, -m, crawlers.steam_ccu_crawler]
            envFrom:
            - configMapRef:
                name: steam-crawler-config
            env:
            - name: STEAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: steam-api
                  key: STEAM_API_KEY
                  optional: true
            - name: CRAWLER_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            resources:
              requests:
                cpu: 250m
                memory: 256Mi
              limits:
                cpu: 250m
                memory: 256Mi
            volumeMounts:
            - name: crawler-state
              mountPath: /data/state
              readOnly: true
          volumes:
          - name: crawler-state
            persistentVolumeClaim:
              claimName: crawler-state-pvc
---
