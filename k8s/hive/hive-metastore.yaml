# Hive Metastore 3.1.3 (Thrift 9083) + PostgreSQL backend.
# Dùng HMS 3.1.3: Spark 3.5 (client Hive 2.3) không gọi được HMS 4.x (lỗi "Invalid method name: 'get_table'").
# Driver PostgreSQL kèm image HMS 3.1.3 cũ, không hỗ trợ SCRAM -> Postgres đặt xác thực md5. Spark kết nối qua HIVE_METASTORE_URI
# (thrift://hive-metastore.hive.svc.cluster.local:9083). Bảng là external Parquet trên HDFS /steam/...
apiVersion: v1
kind: Namespace
metadata:
  name: hive
---
apiVersion: v1
kind: Secret
metadata:
  name: hive-db
  namespace: hive
type: Opaque
stringData:
  # Đổi mật khẩu trước khi triển khai thật
  POSTGRES_DB: metastore
  POSTGRES_USER: hive
  POSTGRES_PASSWORD: change-me-hive
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hive-postgres
  namespace: hive
spec:
  serviceName: hive-postgres
  replicas: 1
  selector:
    matchLabels: {app: hive-postgres}
  template:
    metadata:
      labels: {app: hive-postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16.4
          envFrom:
            - secretRef: {name: hive-db}
          args: ["-c", "password_encryption=md5"]
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_HOST_AUTH_METHOD
              value: md5
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-host=md5"
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: 500m, memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hive-postgres
  namespace: hive
spec:
  selector: {app: hive-postgres}
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-metastore
  namespace: hive
spec:
  replicas: 1
  selector:
    matchLabels: {app: hive-metastore}
  template:
    metadata:
      labels: {app: hive-metastore}
    spec:
      containers:
        - name: metastore
          image: apache/hive:3.1.3
          env:
            - name: SERVICE_NAME
              value: metastore
            - name: DB_DRIVER
              value: postgres
            - name: HIVE_CUSTOM_CONF_DIR
              value: /hive-custom-conf
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: hive-db, key: POSTGRES_PASSWORD}}
            - name: SERVICE_OPTS
              value: >-
                -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
                -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-postgres:5432/metastore
                -Djavax.jdo.option.ConnectionUserName=hive
                -Djavax.jdo.option.ConnectionPassword=$(DB_PASSWORD)
          ports:
            - containerPort: 9083
          readinessProbe:
            tcpSocket: {port: 9083}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: 500m, memory: 1Gi}
          volumeMounts:
            - {name: hive-conf, mountPath: /hive-custom-conf}
      volumes:
        - name: hive-conf
          configMap: {name: hive-site}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-site
  namespace: hive
data:
  hive-site.xml: |
    <configuration>
      <property><name>hive.metastore.warehouse.dir</name><value>hdfs://hdfs-namenode.hdfs.svc.cluster.local:8020/steam/warehouse</value></property>
      <property><name>fs.defaultFS</name><value>hdfs://hdfs-namenode.hdfs.svc.cluster.local:8020</value></property>
      <property><name>hive.metastore.event.db.notification.api.auth</name><value>false</value></property>
    </configuration>
---
apiVersion: v1
kind: Service
metadata:
  name: hive-metastore
  namespace: hive
spec:
  selector: {app: hive-metastore}
  ports:
    - port: 9083
