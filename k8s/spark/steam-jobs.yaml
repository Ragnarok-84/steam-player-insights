# Batch layer: CronJob hằng ngày 01:30 UTC chạy B1 rồi B2>B5>B3>B4>B6>B7>B8 + merge view ES.
# Speed layer: Deployment S1/S2/S3 (strategy Recreate: không để 2 driver dùng chung checkpoint).
# Driver chạy trong pod (client mode, cấu hình ở ConfigMap spark-defaults); executor là pod co giãn 2-6.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: steam-batch-daily
  namespace: spark-jobs
spec:
  schedule: 30 1 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: steam-batch
        spec:
          serviceAccountName: spark-operator-sa
          restartPolicy: Never
          containers:
          - name: batch
            image: steam-spark:1.0.0
            imagePullPolicy: IfNotPresent
            command:
            - sh
            - -c
            - python3 pipeline.py --profile cluster b1 && python3 pipeline.py --profile
              cluster --es batch
            envFrom:
            - configMapRef:
                name: steam-pipeline-config
            env:
            - name: SPARK_DRIVER_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: steam-es-credentials
                  key: elastic
            - name: SPARK_DRIVER_MEMORY
              value: 2g
            ports:
            - containerPort: 7078
              name: driver
            - containerPort: 7079
              name: blockmanager
            volumeMounts:
            - name: spark-defaults
              mountPath: /opt/spark/conf
            resources:
              requests:
                cpu: 500m
                memory: 2560Mi
              limits:
                cpu: '1'
                memory: 3Gi
          volumes:
          - name: spark-defaults
            configMap:
              name: spark-defaults
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steam-s1
  namespace: spark-jobs
  annotations:
    description: review metrics
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: steam-s1
  template:
    metadata:
      labels:
        app: steam-s1
    spec:
      serviceAccountName: spark-operator-sa
      restartPolicy: Always
      containers:
      - name: s1
        image: steam-spark:1.0.0
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - pipeline.py
        - --profile
        - cluster
        - --es
        - s1
        - --
        - --source
        - kafka
        envFrom:
        - configMapRef:
            name: steam-pipeline-config
        env:
        - name: SPARK_DRIVER_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: steam-es-credentials
              key: elastic
        - name: SPARK_DRIVER_MEMORY
          value: 2g
        ports:
        - containerPort: 7078
          name: driver
        - containerPort: 7079
          name: blockmanager
        volumeMounts:
        - name: spark-defaults
          mountPath: /opt/spark/conf
        resources:
          requests:
            cpu: 500m
            memory: 2560Mi
          limits:
            cpu: '1'
            memory: 3Gi
      volumes:
      - name: spark-defaults
        configMap:
          name: spark-defaults
