apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-operator-sa
  namespace: spark-jobs
---
# Driver (client mode) cần tạo/xoá pod executor, service, configmap trong spark-jobs
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-operator-role
  namespace: spark-jobs
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "services", "configmaps", "persistentvolumeclaims"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-operator-rb
  namespace: spark-jobs
subjects:
- kind: ServiceAccount
  name: spark-operator-sa
  namespace: spark-jobs
roleRef:
  kind: Role
  name: spark-operator-role
  apiGroup: rbac.authorization.k8s.io
