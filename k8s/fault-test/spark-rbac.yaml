apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-driver
  namespace: steam-ft
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-driver
  namespace: steam-ft
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps]
    verbs: [get, list, watch, create, delete, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-driver
  namespace: steam-ft
subjects:
  - kind: ServiceAccount
    name: spark-driver
    namespace: steam-ft
roleRef:
  kind: Role
  name: spark-driver
  apiGroup: rbac.authorization.k8s.io
