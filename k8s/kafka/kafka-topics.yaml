apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: steam.reviews.raw
  namespace: kafka
  labels:
    strimzi.io/cluster: steam-kafka-cluster
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 604800000 # 7 ngày
