# Kafka Exporter do Strimzi tạo (spec.kafkaExporter trong k8s/kafka/strimzi-kafka-cluster.yaml):
# consumer lag, offset, thông lượng theo topic -> Grafana D5.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka-exporter
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [kafka]
  selector:
    matchLabels:
      strimzi.io/kind: Kafka
      strimzi.io/name: steam-kafka-cluster-kafka-exporter
  podMetricsEndpoints:
    - port: tcp-prometheus
      path: /metrics
      interval: 30s
