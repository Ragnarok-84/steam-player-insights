# Separate fault-test cluster; never reuse demo PVCs.
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: steam-ft
spec:
  selector:
    app: elasticsearch
  ports:
  - name: http
    port: 9200
    targetPort: 9200
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: steam-ft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      nodeSelector:
        steam.insights/role: storage
      automountServiceAccountToken: false
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
        imagePullPolicy: IfNotPresent
        env:
        - name: discovery.type
          value: single-node
        - name: xpack.security.enabled
          value: 'false'
        - name: xpack.security.enrollment.enabled
          value: 'false'
        - name: node.store.allow_mmap
          value: 'false'
        - name: ES_JAVA_OPTS
          value: -Xms512m -Xmx512m
        ports:
        - name: http
          containerPort: 9200
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: '1'
            memory: 1536Mi
        startupProbe:
          exec:
            command:
            - bash
            - -c
            - curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'
              >/dev/null
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 30
        readinessProbe:
          exec:
            command:
            - bash
            - -c
            - curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'
              >/dev/null
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /usr/share/elasticsearch/data
      initContainers:
      - name: volume-permissions
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - chown 1000:0 /usr/share/elasticsearch/data
        securityContext:
          runAsUser: 0
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: data
          mountPath: /usr/share/elasticsearch/data
  serviceName: elasticsearch
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: steam-ft
spec:
  selector:
    app: kibana
  ports:
  - name: http
    port: 5601
    targetPort: 5601
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: steam-ft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      nodeSelector:
        steam.insights/role: compute
      automountServiceAccountToken: false
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana:8.19.3
        imagePullPolicy: IfNotPresent
        env:
        - name: ELASTICSEARCH_HOSTS
          value: '["http://elasticsearch:9200"]'
        - name: NODE_OPTIONS
          value: --max-old-space-size=512
        - name: TELEMETRY_ENABLED
          value: 'false'
        ports:
        - name: http
          containerPort: 5601
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        startupProbe:
          exec:
            command:
            - bash
            - -c
            - curl -fsS http://localhost:5601/api/status >/dev/null
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 30
        readinessProbe:
          exec:
            command:
            - bash
            - -c
            - curl -fsS http://localhost:5601/api/status >/dev/null
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
