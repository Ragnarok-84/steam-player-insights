    spec:
      containers:
      - command:
        - python3
        - -c
        - |2

          import sys
          import time

          from processing.batch.b9_sentiment_classifier import train_sentiment_classifier
          from processing.common.spark_utils import get_spark_session
          from tests.results_log import record
          from tests.scalability.sc1_sc2_batch_benchmark import _wait_executors

          clean, curated, repeat = sys.argv[1:]
          spark = get_spark_session('Steam Phase 3 B9 recovery')
          try:
              _wait_executors(spark, 2, 180)
              start = time.perf_counter()
              models = train_sentiment_classifier(spark, clean, curated)
              if {model['model'] for model in models} != {'logreg', 'vader'}:
                  raise RuntimeError('B9 did not produce both model evaluations')
              notes = 'B9-only retry; original B2-B8 input; overhead=768Mi (original 512Mi); one core/executor'
              args = dict(member='B', scale=1000, env='k3s', repeat=int(repeat), executors=2,
                          dataset='steam_1000g_20261118', notes=notes)
              record(experiment='batch', job='b9', metrics={'duration_s': time.perf_counter() - start}, **args)
              for model in models:
                  metrics = ['accuracy', 'f1', 'auc']
                  if model['model'] == 'logreg':
                      metrics += ['train_s', 'predict_s']
                  record(experiment='ml', job='b9' if model['model'] == 'logreg' else 'vader',
                         metrics={metric: model[metric] for metric in metrics}, **args)
          finally:
              spark.stop()
        - hdfs://namenode:8020/steam/bench/runs/p3-batch-1000-e2/r3/clean
