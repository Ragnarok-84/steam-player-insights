# Crawler CronJob (namespace default). CCU 10 phút, review 30 phút, appdetails/SteamSpy hằng ngày, AppList hằng tuần.
# CCU/review/appdetails chạy 2 worker song song (Indexed Job, chia game theo appid % 2).
# API key: kubectl create secret generic steam-api --from-literal=STEAM_API_KEY=<key>
# PVC ReadWriteMany cần storage class hỗ trợ (vd. NFS / Longhorn); với local-path đặt WORKERS=1.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crawler-state-pvc
  namespace: default
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: steam-ccu-crawler
  namespace: default
spec:
  schedule: '*/10 * * * *'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: steam-ccu-crawler
            image: steam-crawler:1.0.0
            imagePullPolicy: IfNotPresent
            command:
            - python
            - -m
            - crawlers.steam_ccu_crawler
            env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: steam-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: CRAWLER_OUTPUT
              value: kafka
            - name: CRAWLER_TOTAL_WORKERS
              value: '2'
            - name: CRAWLER_TARGET_LIMIT
              value: '2000'
            - name: STEAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: steam-api
                  key: STEAM_API_KEY
                  optional: true
            - name: CRAWLER_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            resources:
              requests:
                cpu: 250m
                memory: 256Mi
              limits:
                cpu: 250m
                memory: 256Mi
      completionMode: Indexed
      completions: 2
      parallelism: 2
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: steam-reviews-crawler
  namespace: default
spec:
  schedule: '*/30 * * * *'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: steam-reviews-crawler
            image: steam-crawler:1.0.0
            imagePullPolicy: IfNotPresent
            command:
            - python
            - -m
            - crawlers.steam_reviews_crawler
            env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: steam-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: CRAWLER_OUTPUT
              value: kafka
            - name: CRAWLER_TOTAL_WORKERS
              value: '2'
            - name: CRAWLER_TARGET_LIMIT
              value: '2000'
            - name: STEAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: steam-api
                  key: STEAM_API_KEY
                  optional: true
            - name: CRAWLER_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: CURSOR_STATE_DIR
              value: /data/state
            resources:
              requests:
