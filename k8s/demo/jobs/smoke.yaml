apiVersion: batch/v1
kind: Job
metadata:
  name: demo-smoke
  namespace: steam-demo
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: demo-smoke
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        steam.insights/role: compute
      containers:
      - name: spark
        image: localhost/steam-spark-demo:k3s-20261026
        imagePullPolicy: Never
        command:
        - python
        - -m
        - infra.k3s.smoke
        args: []
        env:
        - name: PYSPARK_SUBMIT_ARGS
          value: --master local[2] --driver-memory 2g --conf spark.sql.shuffle.partitions=4
            --conf spark.hadoop.dfs.client.use.datanode.hostname=true pyspark-shell
        resources:
          requests:
            cpu: '1'
            memory: 3Gi
          limits:
            cpu: '2'
            memory: 4Gi
